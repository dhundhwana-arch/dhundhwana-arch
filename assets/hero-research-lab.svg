<svg viewBox="0 0 1200 340" width="1200" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divyesh Bambhaniya — Futuristic AI Research Laboratory Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712"/>
      <stop offset="50%" stop-color="#091126"/>
      <stop offset="100%" stop-color="#0D0824"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#040712" stop-opacity="0"/>
    </radialGradient>
    <pattern id="holoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.55"/>
    </pattern>
  </defs>

  <style>
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinRev  { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulseCore { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes scanMove { 0% { transform: translateY(-20px); opacity: 0; } 50% { opacity: 0.45; } 100% { transform: translateY(340px); opacity: 0; } }
    .orbit1 { transform-origin: 990px 170px; animation: spinSlow 28s linear infinite; }
    .orbit2 { transform-origin: 990px 170px; animation: spinRev 18s linear infinite; }
    .pulse  { animation: pulseCore 4s ease-in-out infinite; }
    .scan   { animation: scanMove 7s linear infinite; }
  </style>

  <!-- Deep-Space Background & Holographic Grid -->
  <rect width="1200" height="340" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="14" fill="url(#holoGrid)"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#38BDF8"/>

  <!-- Subtle Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="13" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Right-Side Animated Holographic AI Core -->
  <circle cx="990" cy="170" r="130" fill="url(#coreGlow)" class="pulse"/>
  <g class="orbit1">
    <circle cx="990" cy="170" r="98" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="12 8" opacity="0.75"/>
    <circle cx="1088" cy="170" r="4.5" fill="#38BDF8"/>
    <circle cx="892" cy="170" r="3.5" fill="#10B981"/>
  </g>
  <g class="orbit2">
    <circle cx="990" cy="170" r="68" fill="none" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="6 6" opacity="0.85"/>
    <circle cx="990" cy="102" r="4" fill="#A78BFA"/>
  </g>
  <polygon points="990,130 1025,150 1025,190 990,210 955,190 955,150" fill="#0B162C" stroke="#38BDF8" stroke-width="1.8" opacity="0.95"/>
  <circle cx="990" cy="170" r="14" fill="#38BDF8" class="pulse"/>
  <circle cx="990" cy="170" r="6" fill="#F8FAFC"/>

  <!-- Left-Side Identity & Scientific Telemetry -->
  <text x="64" y="88" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">
    ● AI RESEARCH LABORATORY // DIGITAL UNIVERSE
  </text>

  <text x="62" y="156" fill="url(#textGrad)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="54" font-weight="800" letter-spacing="1.5">
    DIVYESH BAMBHANIYA
  </text>

  <text x="64" y="198" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="500">
    Independent Project Builder  |  Aspiring AI Researcher  |  Technology Innovator
  </text>

  <rect x="64" y="222" width="660" height="2" fill="url(#accentLine)"/>

  <text x="64" y="258" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
    NODE: @dhundhwana-arch   •   BASE: Vadodara, Gujarat, India   •   FOCUS: AI • Math • Security • Systems
  </text>

  <text x="64" y="294" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5">
    DESIGNED &amp; DEVELOPED BY DIVYESH BAMBHANIYA
  </text>
</svg>
